spring:
  application:
    name: enh-musical

  profiles:
    active: local

  datasource:
    url: jdbc:postgresql://localhost:5432/enh_musical
    username: ${DB_USER:enh_user}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo

  flyway:
    enabled: true
    locations: classpath:db/migration